<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <h1>Multiple Choice Quiz</h1>

        <!-- JavaScript will add the question here -->
        <h2 id="question"></h2>

        <!-- JavaScript will create the option buttons here -->
        <div id="answer-buttons"></div>

        <!-- Message for correct answer -->
        <p id="answer-message"></p>

        <!-- Next Question button -->
        <button id="next-btn" style="display: none;">
            Next Question
        </button>
        <button id="restart-btn" style="display: none;">
    Restart Quiz
</button>

    </div>

    <script src="script.js"></script>

</body>
</html>

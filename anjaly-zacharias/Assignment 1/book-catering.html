<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catering</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1 class="text-center" style="font-family: 'Times New Roman', cursive; font-size: 50px;">Book Catering</h1>
    <form action="submit_booking.php" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required><br><br>

        <label for="date">Event Date:</label>
        <input type="date" id="date" name="date" required><br><br>

        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" required><br><br>

        <label for="menu">Menu Selection:</label>
        <textarea id="menu" name="menu" rows="4" cols="50"></textarea><br><br>

         <a href="https://api.whatsapp.com/send?phone=+919999999999" target="_blank" class="btn btn-success d-flex align-items-center">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp Logo" width="20" height="20" class="me-2">
        Chat with us
    
</body>
</html>

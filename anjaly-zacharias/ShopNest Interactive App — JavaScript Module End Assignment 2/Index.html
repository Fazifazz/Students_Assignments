<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopNest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <h2>ShopNest</h2>

  <input type="text" id="search" placeholder="Search for products...">

  <div class="cart-icon" onclick="toggleCart()">
    🛒 <span id="cart-count">0</span>
  </div>
</header>
<div id="toast">Added to cart</div>
<!-- FILTERS -->
<section class="filters">
  <button data-category="All">All</button>
  <button data-category="Electronics">Electronics</button>
  <button data-category="Clothing">Clothing</button>
  <button data-category="Footwear">Footwear</button>
  <button data-category="Books">Books</button>
</section>

<h2 id="no-results" class="no-results">No products found</h2>

<!-- PRODUCTS -->
<div id="products" class="product-grid"></div>

<!-- SIDE CART -->
<div id="cart-panel" class="cart-panel">
  <h3>Your Cart</h3>
  <div id="cart"></div>
  <h4>Total: ₹<span id="total">0</span></h4>
</div>

<script src="script.js"></script>
</body>
</html>

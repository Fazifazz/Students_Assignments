<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking Flashcards</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Talking Flashcards</h1>
            <p>Learn interactively with voice synthesis</p>
        </header>
        
        <main>
            <div class="flashcard-container">
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-inner">
                        <div class="flashcard-front">
                            <span class="card-label">Question</span>
                            <h2 id="question-text">Loading...</h2>
                        </div>
                        <div class="flashcard-back">
                            <span class="card-label">Answer</span>
                            <h2 id="answer-text">Loading...</h2>
                        </div>
                    </div>
                </div>
            </div>

            <div class="controls" style="gap: 1rem;">
                <button id="prev-btn" class="control-btn" aria-label="Previous card">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <button id="speak-btn" class="primary-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                    Hear Answer
                </button>
                <button id="mic-btn" class="primary-btn" style="background: #e53e3e; box-shadow: 0 10px 15px -3px rgba(229, 62, 62, 0.3);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
                    Answer
                </button>
                <button id="next-btn" class="control-btn" aria-label="Next card">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>
            <div id="recognition-result" style="margin-top: -0.5rem; margin-bottom: 1.5rem; padding: 1rem; border-radius: 12px; background: rgba(255,255,255,0.8); border: 2px dashed #cbd5e0; min-height: 60px; display: none; align-items: center; justify-content: center; text-align: center; font-weight: 500; font-size: 1.1rem; color: var(--text-secondary); transition: all 0.2s;"></div>
            <div class="progress" style="display: flex; align-items: center; justify-content: center; gap: 1rem;">
                <span><span id="current-index">1</span> / <span id="total-cards">1</span></span>
                <button id="restart-btn" class="control-btn" aria-label="Restart" style="width: 36px; height: 36px;" title="Restart">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>

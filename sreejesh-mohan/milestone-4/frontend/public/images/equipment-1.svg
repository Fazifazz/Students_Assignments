<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Solid High-Contrast Background -->
  <rect width="800" height="500" fill="#0f172a"/>
  
  <!-- Subtle Contrast Inner Card -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#1e293b"/>

  <!-- Top Accent Bar -->
  <rect x="20" y="20" width="760" height="8" rx="4" fill="#f59e0b"/>

  <!-- Category Badge -->
  <rect x="50" y="45" width="180" height="30" rx="15" fill="#0f172a"/>
  <text x="140" y="65" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
    POWER TOOLS
  </text>

  <!-- Verified Fleet Tag -->
  <text x="730" y="65" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">
    COMMERCIAL SPEC
  </text>

  <!-- Tool Vector Illustration -->
  
      <!-- Cordless Drill Vector -->
      <rect x="360" y="160" width="70" height="35" rx="6" fill="#f59e0b"/>
      <rect x="430" y="170" width="30" height="15" rx="3" fill="#cbd5e1"/>
      <polygon points="460,175 490,177 460,180" fill="#94a3b8"/>
      <rect x="380" y="195" width="26" height="50" rx="4" fill="#334155"/>
      <rect x="370" y="245" width="46" height="18" rx="4" fill="#f59e0b"/>
      <circle cx="395" cy="205" r="4" fill="#ef4444"/>
    

  <!-- Equipment Title -->
  <text x="400" y="325" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    DeWalt 20V Cordless Hammer Drill
  </text>

  <!-- Specification Subtitle -->
  <text x="400" y="365" fill="#94a3b8" font-family="sans-serif" font-size="15" font-weight="500" text-anchor="middle">
    Masonry & Wood Drilling | 20V Dual Battery
  </text>

  <!-- Bottom Details Bar -->
  <rect x="220" y="405" width="360" height="34" rx="17" fill="#0f172a"/>
  <text x="400" y="427" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    Calibrated &amp; Ready for Immediate Dispatch
  </text>
</svg>
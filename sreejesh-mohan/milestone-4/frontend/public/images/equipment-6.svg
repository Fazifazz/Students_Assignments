<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Solid High-Contrast Background -->
  <rect width="800" height="500" fill="#0f172a"/>
  
  <!-- Subtle Contrast Inner Card -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#1e293b"/>

  <!-- Top Accent Bar -->
  <rect x="20" y="20" width="760" height="8" rx="4" fill="#818cf8"/>

  <!-- Category Badge -->
  <rect x="50" y="45" width="180" height="30" rx="15" fill="#0f172a"/>
  <text x="140" y="65" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
    ACCESS EQUIPMENT
  </text>

  <!-- Verified Fleet Tag -->
  <text x="730" y="65" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">
    COMMERCIAL SPEC
  </text>

  <!-- Tool Vector Illustration -->
  
      <!-- Ladder Vector -->
      <line x1="375" y1="145" x2="375" y2="265" stroke="#818cf8" stroke-width="6"/>
      <line x1="425" y1="145" x2="425" y2="265" stroke="#818cf8" stroke-width="6"/>
      <line x1="375" y1="165" x2="425" y2="165" stroke="#cbd5e1" stroke-width="4"/>
      <line x1="375" y1="190" x2="425" y2="190" stroke="#cbd5e1" stroke-width="4"/>
      <line x1="375" y1="215" x2="425" y2="215" stroke="#cbd5e1" stroke-width="4"/>
      <line x1="375" y1="240" x2="425" y2="240" stroke="#cbd5e1" stroke-width="4"/>
    

  <!-- Equipment Title -->
  <text x="400" y="325" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    Werner 24ft Heavy Duty Ladder
  </text>

  <!-- Specification Subtitle -->
  <text x="400" y="365" fill="#94a3b8" font-family="sans-serif" font-size="15" font-weight="500" text-anchor="middle">
    2nd-Story Roofing & Repair | 300-lb Rated
  </text>

  <!-- Bottom Details Bar -->
  <rect x="220" y="405" width="360" height="34" rx="17" fill="#0f172a"/>
  <text x="400" y="427" fill="#818cf8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    Calibrated &amp; Ready for Immediate Dispatch
  </text>
</svg>
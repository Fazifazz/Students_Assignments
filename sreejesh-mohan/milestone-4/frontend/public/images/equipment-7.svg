<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Solid High-Contrast Background -->
  <rect width="800" height="500" fill="#0f172a"/>
  
  <!-- Subtle Contrast Inner Card -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#1e293b"/>

  <!-- Top Accent Bar -->
  <rect x="20" y="20" width="760" height="8" rx="4" fill="#eab308"/>

  <!-- Category Badge -->
  <rect x="50" y="45" width="180" height="30" rx="15" fill="#0f172a"/>
  <text x="140" y="65" fill="#eab308" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
    HEAVY MACHINERY
  </text>

  <!-- Verified Fleet Tag -->
  <text x="730" y="65" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">
    COMMERCIAL SPEC
  </text>

  <!-- Tool Vector Illustration -->
  
      <!-- Excavator Vector -->
      <rect x="350" y="180" width="65" height="45" rx="6" fill="#eab308"/>
      <rect x="340" y="225" width="85" height="20" rx="10" fill="#334155"/>
      <line x1="415" y1="190" x2="455" y2="165" stroke="#eab308" stroke-width="8" stroke-linecap="round"/>
      <line x1="455" y1="165" x2="475" y2="210" stroke="#eab308" stroke-width="7" stroke-linecap="round"/>
      <polygon points="470,210 490,225 465,225" fill="#475569"/>
    

  <!-- Equipment Title -->
  <text x="400" y="325" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    Caterpillar 1.8T Mini Excavator
  </text>

  <!-- Specification Subtitle -->
  <text x="400" y="365" fill="#94a3b8" font-family="sans-serif" font-size="15" font-weight="500" text-anchor="middle">
    Trenching & Earthmoving | Rubber Tracks & Blade
  </text>

  <!-- Bottom Details Bar -->
  <rect x="220" y="405" width="360" height="34" rx="17" fill="#0f172a"/>
  <text x="400" y="427" fill="#eab308" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    Calibrated &amp; Ready for Immediate Dispatch
  </text>
</svg>
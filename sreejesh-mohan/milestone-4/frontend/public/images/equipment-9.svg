<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Solid High-Contrast Background -->
  <rect width="800" height="500" fill="#0f172a"/>
  
  <!-- Subtle Contrast Inner Card -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#1e293b"/>

  <!-- Top Accent Bar -->
  <rect x="20" y="20" width="760" height="8" rx="4" fill="#14b8a6"/>

  <!-- Category Badge -->
  <rect x="50" y="45" width="180" height="30" rx="15" fill="#0f172a"/>
  <text x="140" y="65" fill="#14b8a6" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
    HEAVY MACHINERY
  </text>

  <!-- Verified Fleet Tag -->
  <text x="730" y="65" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">
    COMMERCIAL SPEC
  </text>

  <!-- Tool Vector Illustration -->
  
      <!-- Plate Compactor Vector -->
      <rect x="350" y="225" width="100" height="16" rx="4" fill="#475569"/>
      <rect x="365" y="175" width="70" height="50" rx="6" fill="#14b8a6"/>
      <line x1="375" y1="175" x2="355" y2="140" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
      <circle cx="400" cy="200" r="12" fill="#1e293b"/>
    

  <!-- Equipment Title -->
  <text x="400" y="325" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    Wacker Neuson Soil Plate Compactor
  </text>

  <!-- Specification Subtitle -->
  <text x="400" y="365" fill="#94a3b8" font-family="sans-serif" font-size="15" font-weight="500" text-anchor="middle">
    Subbase & Soil Compaction | 11 kN Force
  </text>

  <!-- Bottom Details Bar -->
  <rect x="220" y="405" width="360" height="34" rx="17" fill="#0f172a"/>
  <text x="400" y="427" fill="#14b8a6" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    Calibrated &amp; Ready for Immediate Dispatch
  </text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Solid High-Contrast Background -->
  <rect width="800" height="500" fill="#0f172a"/>
  
  <!-- Subtle Contrast Inner Card -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#1e293b"/>

  <!-- Top Accent Bar -->
  <rect x="20" y="20" width="760" height="8" rx="4" fill="#06b6d4"/>

  <!-- Category Badge -->
  <rect x="50" y="45" width="180" height="30" rx="15" fill="#0f172a"/>
  <text x="140" y="65" fill="#06b6d4" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
    CLEANING EQUIPMENT
  </text>

  <!-- Verified Fleet Tag -->
  <text x="730" y="65" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">
    COMMERCIAL SPEC
  </text>

  <!-- Tool Vector Illustration -->
  
      <!-- Pressure Washer Vector -->
      <rect x="360" y="160" width="60" height="70" rx="8" fill="#06b6d4"/>
      <circle cx="370" cy="235" r="14" fill="#334155"/>
      <circle cx="410" cy="235" r="14" fill="#334155"/>
      <line x1="420" y1="175" x2="470" y2="155" stroke="#cbd5e1" stroke-width="4"/>
      <line x1="470" y1="155" x2="495" y2="155" stroke="#06b6d4" stroke-width="3"/>
    

  <!-- Equipment Title -->
  <text x="400" y="325" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    Karcher 3000 PSI Pressure Washer
  </text>

  <!-- Specification Subtitle -->
  <text x="400" y="365" fill="#94a3b8" font-family="sans-serif" font-size="15" font-weight="500" text-anchor="middle">
    Deep Facade & Driveway Cleaning | 3000 PSI
  </text>

  <!-- Bottom Details Bar -->
  <rect x="220" y="405" width="360" height="34" rx="17" fill="#0f172a"/>
  <text x="400" y="427" fill="#06b6d4" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    Calibrated &amp; Ready for Immediate Dispatch
  </text>

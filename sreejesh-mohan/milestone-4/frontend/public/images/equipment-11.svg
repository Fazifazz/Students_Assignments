<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Solid High-Contrast Background -->
  <rect width="800" height="500" fill="#0f172a"/>
  
  <!-- Subtle Contrast Inner Card -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#1e293b"/>

  <!-- Top Accent Bar -->
  <rect x="20" y="20" width="760" height="8" rx="4" fill="#a855f7"/>

  <!-- Category Badge -->
  <rect x="50" y="45" width="180" height="30" rx="15" fill="#0f172a"/>
  <text x="140" y="65" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
    ACCESS EQUIPMENT
  </text>

  <!-- Verified Fleet Tag -->
  <text x="730" y="65" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">
    COMMERCIAL SPEC
  </text>

  <!-- Tool Vector Illustration -->
  
      <!-- Scissor Lift Vector -->
      <rect x="350" y="235" width="100" height="16" rx="4" fill="#334155"/>
      <line x1="365" y1="235" x2="435" y2="195" stroke="#a855f7" stroke-width="4"/>
      <line x1="435" y1="235" x2="365" y2="195" stroke="#a855f7" stroke-width="4"/>
      <line x1="365" y1="195" x2="435" y2="155" stroke="#a855f7" stroke-width="4"/>
      <line x1="435" y1="195" x2="365" y2="155" stroke="#a855f7" stroke-width="4"/>
      <rect x="350" y="145" width="100" height="12" rx="3" fill="#cbd5e1"/>
    

  <!-- Equipment Title -->
  <text x="400" y="325" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    JLG 19ft Electric Scissor Lift
  </text>

  <!-- Specification Subtitle -->
  <text x="400" y="365" fill="#94a3b8" font-family="sans-serif" font-size="15" font-weight="500" text-anchor="middle">
    Indoor Facility & High Ceilings | 19ft Reach
  </text>

  <!-- Bottom Details Bar -->
  <rect x="220" y="405" width="360" height="34" rx="17" fill="#0f172a"/>
  <text x="400" y="427" fill="#a855f7" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    Calibrated &amp; Ready for Immediate Dispatch
  </text>
</svg>
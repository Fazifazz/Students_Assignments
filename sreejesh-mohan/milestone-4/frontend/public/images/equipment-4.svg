<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Solid High-Contrast Background -->
  <rect width="800" height="500" fill="#0f172a"/>
  
  <!-- Subtle Contrast Inner Card -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#1e293b"/>

  <!-- Top Accent Bar -->
  <rect x="20" y="20" width="760" height="8" rx="4" fill="#10b981"/>

  <!-- Category Badge -->
  <rect x="50" y="45" width="180" height="30" rx="15" fill="#0f172a"/>
  <text x="140" y="65" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
    PAINTING & FINISHING
  </text>

  <!-- Verified Fleet Tag -->
  <text x="730" y="65" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">
    COMMERCIAL SPEC
  </text>

  <!-- Tool Vector Illustration -->
  
      <!-- Paint Sprayer Vector -->
      <rect x="350" y="160" width="80" height="70" rx="8" fill="#10b981"/>
      <polygon points="430,175 470,165 470,195" fill="#334155"/>
      <rect x="470" y="175" width="18" height="10" fill="#cbd5e1"/>
      <rect x="385" y="230" width="40" height="25" rx="4" fill="#334155"/>
      <line x1="488" y1="180" x2="520" y2="165" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>
      <line x1="488" y1="180" x2="525" y2="180" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>
      <line x1="488" y1="180" x2="520" y2="195" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>
    

  <!-- Equipment Title -->
  <text x="400" y="325" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    Wagner Professional Paint Sprayer
  </text>

  <!-- Specification Subtitle -->
  <text x="400" y="365" fill="#94a3b8" font-family="sans-serif" font-size="15" font-weight="500" text-anchor="middle">
    Exterior & Interior Walls | Airless High Pressure
  </text>

  <!-- Bottom Details Bar -->
  <rect x="220" y="405" width="360" height="34" rx="17" fill="#0f172a"/>
  <text x="400" y="427" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    Calibrated &amp; Ready for Immediate Dispatch
  </text>
</svg>
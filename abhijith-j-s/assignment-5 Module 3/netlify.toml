[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so React Router routes work on refresh / direct links.
# Netlify serves real files (e.g. /products.json, /assets/*) first because
# this rule is not forced, so static data and future API proxies are unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

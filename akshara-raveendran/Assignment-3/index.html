<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Quiz App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="quiz-container">

        <div class="quiz-card">

            <!-- Quiz Header -->
            <header class="quiz-header">

                <h1>
                    JavaScript Quiz
                </h1>

                <p id="progress" class="progress"></p>

            </header>


            <!-- Quiz Screen -->
            <section id="quiz-screen">

                <!-- Question will be added using JavaScript -->
                <h2 id="question"></h2>

                <!-- Options will be added dynamically using JavaScript -->
                <div id="options" class="options"></div>

                <!-- Answer feedback -->
                <p id="feedback" class="feedback"></p>

                <!-- Next Question Button -->
                <button
                    id="next-btn"
                    class="next-btn"
                    type="button"
                    disabled>
                    Next Question
                </button>

            </section>


            <!-- Final Result Screen -->
            <section id="result-screen" class="result-screen hidden">

                <p class="small-text">
                    Quiz Complete
                </p>

                <h2 id="score-text"></h2>

                <p id="result-feedback"></p>

                <!-- Restart Button -->
                <button
                    id="restart-btn"
                    class="restart-btn"
                    type="button">
                    Restart Quiz
                </button>

            </section>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNest - Online Shopping</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>ShopNest</h1>
    <p>Your one-stop shopping destination</p>
    <div>
      <input type="text" id="searchInput"
        placeholder="Search products...">
      <button id="cartButton">
        Cart (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <main>
    <section id="categories">
      <h2>Shop by Category</h2>
      <button class="category-btn" data-category="All">All</button>
      <button class="category-btn" data-category="Electronics">Electronics</button>
      <button class="category-btn" data-category="Clothing">Clothing</button>
      <button class="category-btn" data-category="Footwear">Footwear</button>
      <button class="category-btn" data-category="Books">Books</button>
    </section>

    <section>
      <h2>Our Products</h2>
      <div id="productContainer"></div>
      <p id="noProducts" hidden>No products found.</p>
    </section>

    <section id="cartSection">
      <h2>Shopping Cart</h2>
      <div id="cartItems"></div>
      <h3>Total: ₹<span id="cartTotal">0.00</span></h3>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

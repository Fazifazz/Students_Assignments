# Render blueprint for the SpendWise API.
# Deploy with: render blueprint launch  (or connect the repo in the dashboard)
services:
  - type: web
    name: spendwise-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # set in the dashboard — never commit the connection string
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: spendwise_token
      - key: CLIENT_ORIGIN
        sync: false # the deployed frontend origin, e.g. https://spendwise.netlify.app
      - key: FRONTEND_URL
        sync: false # the deployed frontend origin (used in reset links)
      - key: RESET_TOKEN_TTL_MINUTES
        value: 60
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
